<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;line-height:1.6}
.w{max-width:640px;margin:auto;padding:18px}
h1{color:var(--pk);margin:8px 0 2px;font-size:26px}.s{color:var(--mut);margin:0 0 18px;font-size:14px}
.c{display:block;width:100%;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 10px;color:var(--tx);font:inherit;cursor:pointer}
.c b{color:var(--pk);display:block}.c span{color:var(--mut);font-size:13px}
.q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.qt{direction:ltr;text-align:left;font-size:16px;margin-bottom:8px}
.o{direction:ltr;text-align:left;display:block;width:100%;background:#241d26;border:1px solid var(--line);border-radius:10px;color:var(--tx);padding:9px 12px;margin:6px 0;font:inherit;cursor:pointer}
.o.sel{border-color:var(--pk);background:#33232c}.o.ok{border-color:var(--ok);background:#1d2e24}.o.no{border-color:var(--no);background:#33202a}
.b{background:var(--pk);color:#2a1620;border:0;border-radius:12px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;width:100%;margin:8px 0}
.g{background:transparent;color:var(--pk);border:1px solid var(--pk)}
.r{text-align:center;background:var(--card);border:1px solid var(--pk);border-radius:14px;padding:16px;margin-bottom:14px}
.r big{display:block;font-size:34px;color:var(--pk)}

var app=document.getElementById('app'),best={};
try{best=JSON.parse(localStorage.getItem('kalk')||'{}')}catch(e){}
function home(){
var h='<h1>مراجعة كالك</h1><p class="s">اختر اختبار، وبعد ما تنهيه تطلع درجتك والإجابات</p>';
E.forEach(function(e,i){h+='<button class="c" onclick="start('+i+')"><b>'+e.n+'</b><span>'+e.q.length+' سؤال'+(best[i]!=null?' · أفضل نتيجة: '+best[i]+'/'+e.q.length:'')+'</span></button>'});
app.innerHTML=h}
var cur,ans,done;
function opts(q){return typeof q[1]==='number'?['True','False']:q[1]}
function key(q){return typeof q[1]==='number'?(q[1]?0:1):q[2]}
function start(i){cur=i;ans=[];done=false;draw()}
function pick(a,b){if(done)return;ans[a]=b;draw(true)}
function draw(keep){
var e=E[cur],y=window.scrollY,h='<button class="b g" onclick="home()">← الرئيسية</button><h1>'+e.n+'</h1><div id="res"></div>';
e.q.forEach(function(q,a){
h+='<div class="q"><div class="qt"><b>'+(a+1)+'.</b> '+q[0]+'</div>';
opts(q).forEach(function(o,b){
var c='o';if(done){if(b===key(q))c+=' ok';else if(ans[a]===b)c+=' no'}else if(ans[a]===b)c+=' sel';
h+='<button class="'+c+'" onclick="pick('+a+','+b+')">'+o+'</button>'});
h+='</div>'});
h+=done?'<button class="b" onclick="start('+cur+')">إعادة الاختبار</button>':'<button class="b" onclick="fin()">إنهاء وعرض الدرجة</button>';
app.innerHTML=h;
if(done){var s=sc(),n=e.q.length;document.getElementById('res').innerHTML='<div class="r"><big>'+s+' / '+n+'</big>'+Math.round(s/n*100)+'%</div>'}
window.scrollTo(0,keep?y:0)}
function sc(){var s=0;E[cur].q.forEach(function(q,a){if(ans[a]===key(q))s++});return s}
function fin(){done=true;var s=sc();if(best[cur]==null||s>best[cur]){best[cur]=s;try{localStorage.setItem('kalk',JSON.stringify(best))}catch(e){}}draw();window.scrollTo(0,0)}
home();
